<body>
  <!-- 공통 상단 네비게이션이 들어갈 자리 -->

      <!-- 지도교수 카드 -->
      <div class="pi-card">

        <img src="assets/images/pi_profile.jpg" alt="권순범 교수 프로필 사진" class="pi-image" />
      </div>
      
      <div class="pi-info">
        <h3 style="font-size: 1.5rem; color: var(--primary);">권순범 (Sun-Beom Kwon)</h3>
        <p style="color: var(--primary-light); font-weight: 600; margin-bottom: 12px;"> 조교수</p>
        <p style="color: var(--text-muted); margin-bottom: 16px;">
          인공지능, 전산역학, 구조 동역학, 유한요소해석, 자율운항선박<br />
          <strong>Office:</strong> D동 413호 | <strong>Email:</strong> sbkwon@hongik.ac.kr
        </p>
        <a href="#">[Google Scholar]</a>
      </div>
    </div>

      <!-- 연구원 그리드 -->
      <h3 style="color: var(--primary); margin-bottom: 20px;">Graduate Students</h3>
      <div class="team-grid">
        <div class="member-card">
          <div class="member-avatar">Ph.D.</div>
          <h4>김철수</h4>
          <p style="color: var(--primary-light); font-size: 0.85rem;">박사과정</p>

        </div>

          <div class="member-avatar">M.S.</div>
          <h4>이영희</h4>
          <p style="color: var(--primary-light); font-size: 0.85rem;">석사과정</p>
          <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 6px;">유체-구조 연성(FSI)</p>
        </div>

        <div class="member-card">
          <div class="member-avatar">M.S.</div>
          <h4>박민수</h4>
          <p style="color: var(--primary-light); font-size: 0.85rem;">석사과정</p>

        </div>
      </div>

  <!-- 공통 상하단바를 로드하는 스크립트 실행 -->
